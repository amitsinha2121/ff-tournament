<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FF Tournament</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            background: #ff4500;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        .hero {
            padding: 30px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #cccccc;
        }
.hero h3 {
    color: #ff4500;
    font-size: 22px;
    margin: 8px 0;
}
        .tournament {
            margin: 20px;
            padding: 20px;
            background: #1d1d1d;
            border-radius: 15px;
        }

        .tournament h3 {
            color: #ff4500;
            margin-bottom: 10px;
        }

        .info {
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4500;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
       .register-button {
    display: block;
    width: fit-content;
    margin: 15px auto;
    padding: 12px 28px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.status-check {
    margin: 20px;
    padding: 20px;
    background: #1d1d1d;
    border-radius: 15px;
    text-align: center;
}

.status-check h3 {
    color: #ff4500;
    margin-bottom: 15px;
}

.status-check input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.status-check button {
    width: 100%;
    margin-top: 12px;
}

#statusMessage {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

    <header>
        <h1>🔥 FF TOURNAMENT</h1>
    </header>

<section class="hero">
    <h2>Free Fire Tournament</h2>
    <p>Organized by</p>
    <h3>LAMUI GAMING</h3>
    <p>Join • Compete • Win 🏆</p>
</section>
    <div class="tournament">
<a href="/notices.html" class="notice-button">
    📢 Notice Board
</a>
<a href="/leaderboard.html" class="notice-button">
    🏆 Leaderboard
</a>
<button class="register-button" onclick="location.href='register.html'">
    REGISTER NOW
</button>
<div class="status-check">
    <h3>🔎 Registration Status</h3>

    <input
        type="text"
        id="statusUid"
        placeholder="Enter Captain UID"
    >

    <button onclick="checkRegistration()">
        CHECK STATUS
    </button>

    <p id="statusMessage"></p>
</div>
  </div>
<script>
async function checkRegistration() {
    const uid = document.getElementById("statusUid").value.trim();
    const message = document.getElementById("statusMessage");

    if (!uid) {
        message.innerText = "❌ Captain UID দিন";
        return;
    }

    message.innerText = "⏳ Checking...";

    try {
        const response = await fetch(
            "/player/" + encodeURIComponent(uid)
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            message.innerText =
                "❌ " + (data.message || "Registration পাওয়া যায়নি");
            return;
        }

        const team = data.data;
        const status = team.status || "Pending";

        if (status === "Approved") {
            message.innerText =
                "✅ APPROVED\nTeam: " + (team.team_name || "-");
        } else if (status === "Rejected") {
            message.innerText =
                "❌ REJECTED\nTeam: " + (team.team_name || "-");
        } else {
            message.innerText =
                "⏳ PENDING\nTeam: " + (team.team_name || "-");
        }

    } catch (error) {
        message.innerText =
            "❌ Server error. আবার চেষ্টা করুন।";
    }
}
</script>
</body>
</html>
