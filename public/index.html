<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FF Tournament</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            background: #ff4500;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        .hero {
            padding: 30px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #cccccc;
        }

        .tournament {
            margin: 20px;
            padding: 20px;
            background: #1d1d1d;
            border-radius: 15px;
        }

        .tournament h3 {
            color: #ff4500;
            margin-bottom: 10px;
        }

        .info {
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4500;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
       .register-button {
    display: block;
    width: fit-content;
    margin: 15px auto;
    padding: 12px 28px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

    <header>
        <h1>🔥 FF TOURNAMENT</h1>
    </header>

    <section class="hero">
        <h2>Free Fire Tournament</h2>
        <p>Join • Compete • Win 🏆</p>
    </section>

    <div class="tournament">
        <h3>🏆 Clash Squad Tournament</h3>

        <p class="info">💰 Entry Fee: ৳200</p>
        <p class="info">👥 Teams: 16</p>
        <p class="info">🥇 Winner Prize: ৳2000</p>
        <p class="info">🥈 Runner-up: ৳1000</p>
        <p class="info">📅 Date: Coming Soon</p>
<a href="/notices.html" class="notice-button">
    📢 Notice Board
</a>
<a href="/leaderboard.html" class="notice-button">
    🏆 Leaderboard
</a>
<button class="register-button" onclick="location.href='register.html'">
    REGISTER NOW
</button>    </div>

</body>
</html>
